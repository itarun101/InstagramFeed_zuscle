name: Zuscle Instagram post

on:
  schedule:
    - cron: "30 11 * * 1,3,5"   # Mon/Wed/Fri 11:30 UTC - edit to taste
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to Instagram (false = dry run)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: zuscle-post

jobs:
  post:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Generate content and render slides
        id: prep
        run: |
          python run.py --stage prepare | tee prep.log
          echo "dir=$(grep '^POST_DIR=' prep.log | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # Instagram fetches images itself, so they must be public before publishing.
      - name: Commit slides so they get a public URL
        run: |
          git config user.name "zuscle-bot"
          git config user.email "zuscle-bot@users.noreply.github.com"
          git add posts
          git commit -m "Add post assets"
          git push
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish to Instagram
        if: github.event_name == 'schedule' || inputs.publish
        env:
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ env.SHA }}
        run: python run.py --stage publish --dir "${{ steps.prep.outputs.dir }}"

      - name: Record result
        if: github.event_name == 'schedule' || inputs.publish
        run: |
          git add posts
          git commit -m "Record published post" || exit 0
          git push
